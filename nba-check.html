<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBA live check</title>
<style>
:root{color-scheme:light dark;--bg:#f3f4f7;--ink:#1a1f2b;--muted:#5f6878;--ok:#1f8a4c;--bad:#c4321f;--line:#d9dde4}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--ink:#e8ebf1;--muted:#98a1b2;--ok:#4cc27e;--bad:#ff6b57;--line:#2a303c}}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
h1{font-size:1.2rem;margin:0 0 12px}h2{font-size:1rem;margin:18px 0 6px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.muted{color:var(--muted)}
pre{white-space:pre-wrap;word-break:break-word;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.8rem}
li{margin:2px 0}
</style></head><body>
<h1>NBA live endpoint check</h1>
<p class="muted">Calls NBA's live data straight from this page, the way the app would. <a href="./">Back to the app</a></p>
<div id="out">Checking…</div>
<script>
const NBA = "https://cdn.nba.com/static/json/liveData";
const out = document.getElementById("out"), esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const add = h => out.insertAdjacentHTML("beforeend", h);
async function get(url){
  const t = performance.now();
  try { const r = await fetch(url, {cache:"no-store"}); const ms = Math.round(performance.now() - t);
    if (!r.ok) return {err:`HTTP ${r.status} after ${ms} ms`};
    return {json: await r.json(), ms};
  } catch (e) { return {err:`${e.name}: ${e.message} (blocked by the browser, usually CORS or network)`}; }
}
(async () => {
  out.innerHTML = "";
  add(`<h2>Scoreboard</h2>`);
  const sb = await get(`${NBA}/scoreboard/todaysScoreboard_00.json`);
  if (sb.err) { add(`<p class="bad">Failed: ${esc(sb.err)}</p>`); return; }
  const games = sb.json.scoreboard.games;
  add(`<p class="ok">OK in ${sb.ms} ms · ${esc(sb.json.scoreboard.gameDate)} · ${games.length} games</p><ul>${games.map(g => `<li>${esc(g.awayTeam.teamTricode)} ${g.awayTeam.score} @ ${esc(g.homeTeam.teamTricode)} ${g.homeTeam.score} · <span class="muted">${esc(g.gameStatusText)}</span></li>`).join("")}</ul>`);
  const g = games.find(x => x.gameStatus === 2) || games.find(x => x.gameStatus === 3) || games[0];
  if (!g) return;
  add(`<h2>Box score: ${esc(g.awayTeam.teamTricode)} @ ${esc(g.homeTeam.teamTricode)}</h2>`);
  const bx = await get(`${NBA}/boxscore/boxscore_${g.gameId}.json`);
  if (bx.err) { add(`<p class="bad">Failed: ${esc(bx.err)}</p><p class="muted">Before tip-off NBA often has no box score file yet (403 or 404), so try again once the game starts.</p>`); return; }
  const gm = bx.json.game, ps = [...gm.awayTeam.players, ...gm.homeTeam.players];
  add(`<p class="ok">OK in ${bx.ms} ms · ${ps.length} players · ${esc(gm.gameStatusText)}</p><ul>${ps.filter(p => p.played === "1").slice(0, 8).map(p => `<li>${esc(p.name)} · ${p.statistics.points} pts ${p.statistics.reboundsTotal} reb ${p.statistics.assists} ast</li>`).join("") || `<li class="muted">Nobody has played yet.</li>`}</ul>`);
})();
</script>
</body></html>
